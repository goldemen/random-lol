<h2>Champions</h2>

@if (rows$ | async; as rows) {
  <table mat-table [dataSource]="rows" class="mat-elevation-z2" style="width: 100%">
    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <!-- Roles (joined) -->
    <ng-container matColumnDef="rolesText">
      <th mat-header-cell *matHeaderCellDef>Roles</th>
      <td mat-cell *matCellDef="let row">{{ rolesText(row) }}</td>
    </ng-container>

    <!-- Buttons -->
    <ng-container matColumnDef="buttons">
      <th mat-header-cell *matHeaderCellDef>Modifier</th>
      <td mat-cell *matCellDef="let row">
        <button (click)="openEditDialog(row)">Modifier les rôles</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
} @else {
  <p>Loading…</p>
}
